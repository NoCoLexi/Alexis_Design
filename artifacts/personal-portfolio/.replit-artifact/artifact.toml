kind = "web"
previewPath = "/"
title = "Alexis Brochu — Personal Portfolio"
description = "A password-protected personal portfolio for Alexis Brochu. First-person copy, Alexis Brochu branding. Only accessible to invited viewers."
version = "1.0.0"
id = "artifacts/personal-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20176

[services.development]
run = "pnpm --filter @workspace/personal-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/personal-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/personal-portfolio/dist"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20176"
BASE_PATH = "/"
