<!DOCTYPE html>
<html>
<head>
    <title>Audio Test</title>
</head>
<body>
    <h1>Audio Test</h1>
    <audio controls>
        <source src="/attached_assets/Hire%20Me%20(Design%20and%20Groove)_1754579236907.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    
    <br><br>
    <button onclick="playAudio()">Test Play Button</button>
    
    <script>
        function playAudio() {
            const audio = document.querySelector('audio');
            console.log('Audio element:', audio);
            console.log('Audio src:', audio.src);
            audio.play().then(() => {
                console.log('Audio played successfully');
            }).catch(error => {
                console.error('Audio play failed:', error);
            });
        }
    </script>
</body>
</html>
